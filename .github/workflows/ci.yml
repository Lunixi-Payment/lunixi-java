name: Java SDK verification
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: JDK ${{ matrix.java }} build and security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.7.1'
      - name: Strict javac, full tests and SpotBugs
        run: gradle --no-daemon -I tools/verification.init.gradle clean test spotbugsMain resolvedAuditDependencies centralBundle -PlunixiUnsigned --console=plain
      - name: JDK17 artifact, POM and unsigned bundle layout
        run: python3 tools/check-artifacts.py
      - name: Audit resolved test dependencies
        run: python3 tools/audit-dependencies.py
      - name: Install pinned source secret scanner
        if: matrix.java == '17'
        run: |
          mkdir -p "$RUNNER_TEMP/lunixi-java-tools"
          GOBIN="$RUNNER_TEMP/lunixi-java-tools" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/lunixi-java-tools" >> "$GITHUB_PATH"
      - name: Full clean source secret scan and negative control
        if: matrix.java == '17'
        run: python3 tools/check-secrets.py
